controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    range_sensor_broadcaster:
      type: range_sensor_broadcaster/RangeSensorBroadcaster

    temperature_broadcaster:
      type: hardware_controller/TemperatureBroadcaster

    gnss_broadcaster:
      type: hardware_controller/GnssBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    laser_broadcaster:
      type: hardware_controller/LaserBroadcaster

forward_position_controller:
  ros__parameters:
    joints:
      - xm540_joint
    interface_name: position

range_sensor_broadcaster:
  ros__parameters:
    sensor_name: echosounder
    frame_id: sonar_link
    # SLD-100 wg specyfikacji producenta: zakres 0.3-100 m.
    min_range: 0.3
    max_range: 100.0
    field_of_view: 0.0
    radiation_type: 0  # 0 = ultradźwięki

temperature_broadcaster:
  ros__parameters:
    sensor_name: echosounder
    frame_id: sonar_link

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu
    # Frame samego modułu. Gdzie on siedzi na kadłubie, opisuje URDF — orientację
    # publikujemy w układzie czujnika i nie przekręcamy jej w kodzie.
    frame_id: imu_link

laser_broadcaster:
  ros__parameters:
    sensor_name: laser
    frame_id: laser_link
    # USTAWIONE POD DALMIERZ JRT (laser_type:=jrt, stan od 2026-08-30).
    # Wartości muszą się zgadzać z min_range/max_range podanymi wtyczce w
    # laser.xacro - tu opisują tylko to, co ląduje w polach wiadomości.
    #
    # 0,03-100 m pochodzi z instrukcji B87A, która opisuje moduł większy od
    # naszego, więc to filtr bzdur, a nie specyfikacja. Minimum dla tego
    # egzemplarza nie zostało zmierzone.
    #
    # DLA SHARPA (laser_type:=sharp) wpisać z powrotem 1.0 / 3.0 oraz
    # diag_interfaces: "adc,adc_spread,sample_time" - tam 1-3 m to granice WIARYGODNOŚCI
    # krzywej, poza którymi wtyczka zwraca NaN.
    min_range: 0.03
    max_range: 100.0
    # Dwa kanały diagnostyczne trafiające na ~/raw jako x i y.
    # JRT: jakość sygnału (MNIEJSZA liczba = MOCNIEJSZY sygnał) i kod statusu.
    # Trzeci kanał to moment ROZPOCZĘCIA strzału - po nim sweep decyduje, kiedy
    # ruszyć głowicę, a kolektor odrzuca pomiary powstałe jeszcze w ruchu.
    diag_interfaces: "signal_quality,status_code,shot_start"
    # Producent nie podaje szerokości wiązki; 0.0 jak przy echosondzie.
    field_of_view: 0.0
    radiation_type: 1  # sensor_msgs/Range::INFRARED

gnss_broadcaster:
  ros__parameters:
    sensor_name: gnss
    # Frame anteny głównej mosaic-H; link docelowo w bathset_description,
    # gdy powstanie pełny model zestawu.
    frame_id: gnss_link
