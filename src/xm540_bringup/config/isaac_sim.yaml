isaac_sim_node:
  ros__parameters:

    # --- Łódka ---
    boat_speed:             1.0   # prędkość łódki [m/s]
    boat_arrival_tolerance: 0.05  # tolerancja dojazdu do waypointa [m]

    # --- Sonar ---
    sonar_rate_hz:       20.0   # częstotliwość publikowania pomiaru [Hz]
    sonar_range_max:    500.0   # maksymalny zasięg sonara [m]
    sonar_beam_half_deg:  1.0   # półkąt stożka wiązki [°]
