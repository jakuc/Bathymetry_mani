sim_driver_node:
  ros__parameters:

    # --- Profil ruchu manipulatora ---
    max_vel_rad_s:  2.69   # max prędkość jointa [rad/s]
    max_acc_rad_s2: 10.0   # max przyspieszenie [rad/s²]

---

mission_supervisor_node:
  ros__parameters:

    # --- Scenariusz 1: Pomiar batymetryczny (pionowy sonar) ---
    waypoints_file: "/workspace/install/xm540_bringup/share/xm540_bringup/waypoints_time_15.2min_1.0mps.csv"
    boat_buffer_size: 5         # ile waypointów z góry w kolejce Isaaca
    stabilize_time: 0.1         # czas czekania po dotarciu (sweep) [s]
    n_readings: 1               # liczba pomiarów sonaru na waypoint
    progress_interval: 0        # 0 = co 5% misji; >0 = co N waypointów

    # --- Scenariusz 2: Sweep z wybranych punktów ---
    sweep_waypoints_file: "/workspace/install/xm540_bringup/share/xm540_bringup/waypoints_sweep_2pt_x5.csv"
    sweep_stabilize_time: 1.0   # dłuższe czekanie — manipulator musi spaść na miejsce
    sweep_range_deg: 90.0       # półkąt stożka [°]
    sweep_step_deg: 1.0         # rozdzielczość kątowa [°]
    sweep_tolerance_deg: 0.5    # tolerancja pozycji jointa [°]

    # --- Skala świata (musi zgadzać się z world_scale w isaac_sim) ---
    world_scale: 5.0

---

waypoint_viz_node:
  ros__parameters:
    waypoints_file: "/workspace/install/xm540_bringup/share/xm540_bringup/waypoints_time_15.2min_1.0mps.csv"
