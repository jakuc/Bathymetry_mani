# Override dla gałęzi HW (serwo Dynamixel przez U2D2, echosonda SLD-100)
# Użycie: docker compose -f docker/docker-compose.yml -f docker/docker-compose.hw.yml up
#
# Wymaga wcześniejszego podpięcia sprzętu - udev rules tworzą /dev/u2d2 i
# /dev/echosounder automatycznie (patrz udev/99-dynamixel.rules, udev/99-echosounder.rules)

services:
  mani_ros:
    devices:
      - /dev/u2d2:/dev/u2d2
      - /dev/echosounder:/dev/echosounder
