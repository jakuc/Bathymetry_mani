# /etc/systemd/system/systemd-networkd-wait-online.service.d/10-bathset.conf
#
# DLACZEGO: bez tego hotspot wstawal ~190 s po starcie jadra, choc radio bylo
# gotowe po 60 s (zmierzone w journalu 2026-09-17). Zakleszczenie:
#
#   wait-online czeka, az wlan0 bedzie "online"
#   -> wlan0 dostaje carrier dopiero, gdy wstanie hostapd
#   -> hostapd startuje z bathset-netmode, ktory jest After=network.target
#   -> network.target czeka na sysinit.target <- cloud-init.service <- wait-online
#
# Kolko przecinal dopiero domyslny timeout wait-online: 2 min 0,18 s.
#
# DLACZEGO NIE `RequiredForOnline=no` w 20-wlan0-ap.network: eth0 juz jest
# opcjonalny (netplan), wiec po oznaczeniu wlan0 NIE ZOSTALBY ZADEN wymagany
# interfejs, a systemd 249 w takim ukladzie i tak czeka na "co najmniej jeden
# online" - czyli dalej do timeoutu.
#
# ROZWIAZANIE: czekamy wylacznie na POJAWIENIE SIE wlan0 ze stanem no-carrier -
# tyle wlasnie ma interfejs AP z adresem statycznym (ConfigureWithoutCarrier)
# zanim ruszy hostapd. Timeout 30 s to bezpiecznik, gdyby ta wersja systemd
# oceniala stan inaczej: najgorszy przypadek to 30 s zamiast 120 s.
#
# Nie ma tu ryzyka odciecia plytki: wait-online nie blokuje rozruchu, tylko go
# opoznia, a bathset-netmode ponawia start hostapd, dopoki ten nie wstanie.
[Service]
ExecStart=
ExecStart=/lib/systemd/systemd-networkd-wait-online --interface=wlan0:no-carrier --timeout=30
