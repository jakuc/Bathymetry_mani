# /etc/security/limits.d/99-bathset-realtime.conf
#
# Pozwala ros2_control_node wejść w SCHED_FIFO. Bez tego controller_manager
# loguje przy starcie "Could not enable FIFO RT scheduling policy: Operation not
# permitted" i pętla serw 50 Hz rywalizuje o CPU na równi z kompilatorem, WiFi
# i czymkolwiek innym - zauważone w logu 2026-09-17.
#
# Dlaczego to ma znaczenie dopiero teraz: przy skanie CIĄGŁYM stempel czasu
# /joint_states powstaje w tej pętli, a jej spóźnienie jest wprost błędem kąta
# przypisanego do pomiaru. Czas dalmierza jest odporny (stempluje go Nano), czas
# enkoderów - nie.
#
# controller_manager w Humble prosi o priorytet 50, więc rtprio musi być >= 50.
# memlock: pamięć procesu RT nie powinna iść na swap / być stronicowana w pętli.
#
# Działa od NASTĘPNEGO logowania (pam_limits przy otwarciu sesji) - stack
# uruchomiony z sesji otwartej przed instalacją tego pliku dalej go nie ma.
ubuntu  -  rtprio   95
ubuntu  -  memlock  unlimited
