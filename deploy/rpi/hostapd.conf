# Punkt dostepowy plytki bathset - stacja laczy sie PROSTO z plytka, bez routera.
#
# Po co: zeby pomiar dalo sie prowadzic bez kabla i bez zaleznosci od cudzej
# sieci. Wariant "plytka jako klient domowego WiFi" tez dziala, ale wprowadza
# trzeciego uczestnika - router - ktory decyduje o multicascie, adresach z DHCP
# i opoznieniu. Pomiar 2026-08-30: przez router ping avg ~20 ms i skoki do
# 120 ms, dwupunktowo po hotspocie avg 5,6 ms i max 8,6 ms.
#
# hw_mode=g, bo Pi 3B ma radio TYLKO 2,4 GHz (jedno pasmo w `iw list`).
#
# HASLO: to poswiadczenie do lacza point-to-point miedzy stacja a plytka, a nie
# do zadnej cudzej sieci. Podmienia je install.sh, gdy ustawisz BATHSET_AP_PASS.
interface=wlan0
driver=nl80211
ssid=bathset
country_code=PL
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=bathset2026
ignore_broadcast_ssid=0
